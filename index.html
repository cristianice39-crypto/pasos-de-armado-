<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bitácora de Ingeniería — Brazo Robótico 6DOF</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body id="rn-red">
  <header class="topbar">
    <div class="brand">
      <div class="brand-pulse"></div>
      <div>
        <h1>ROBOTICS_LOG // <span id="typewriter"></span></h1>
        <p class="subtitle">Arquitectura de Marcos Animados &amp; Red Neuronal de Ensamblaje</p>
      </div>
    </div>
    <div class="controls">
      <span class="status-indicator"><span class="rn-pin"></span> Nodos Activos</span>
    </div>
  </header>

  <main class="container">
    <section class="gallery-grid" id="galleryGrid">
      <article class="card">
        <span class="step-label">PASO 1</span>
        <div class="frame-stage">
          <div class="photo-inner">
            <img src="foto-01-ensamble-pinza.jpeg" alt="Paso 1" loading="lazy" />
          </div>
        </div>
      </article>

      <article class="card">
        <span class="step-label">PASO 2</span>
        <div class="frame-stage">
          <div class="photo-inner">
            <img src="foto-02-detalle-servos.jpeg" alt="Paso 2" loading="lazy" />
          </div>
        </div>
      </article>

      <article class="card">
        <span class="step-label">PASO 3</span>
        <div class="frame-stage">
          <div class="photo-inner">
            <img src="foto-03-arduino-base.jpeg" alt="Paso 3" loading="lazy" />
          </div>
        </div>
      </article>

      <article class="card">
        <span class="step-label">PASO 4</span>
        <div class="frame-stage">
          <div class="photo-inner">
            <img src="foto-04-shield-pwm.jpeg" alt="Paso 4" loading="lazy" />
          </div>
        </div>
      </article>

      <article class="card">
        <span class="step-label">PASO 5</span>
        <div class="frame-stage">
          <div class="photo-inner">
            <img src="foto-05-interior-chasis.jpeg" alt="Paso 5" loading="lazy" />
          </div>
        </div>
      </article>

      <article class="card">
        <span class="step-label">PASO 6</span>
        <div class="frame-stage">
          <div class="photo-inner">
            <img src="foto-06-cableado-servos.jpeg" alt="Paso 6" loading="lazy" />
          </div>
        </div>
      </article>

      <article class="card">
        <span class="step-label">PASO 7</span>
        <div class="frame-stage">
          <div class="photo-inner">
            <img src="foto-07-pinza-mecanismo.jpeg" alt="Paso 7" loading="lazy" />
          </div>
        </div>
      </article>

      <article class="card">
        <span class="step-label">PASO 8</span>
        <div class="frame-stage">
          <div class="photo-inner">
            <img src="foto-08-mecanismo-cierre.jpeg" alt="Paso 8" loading="lazy" />
          </div>
        </div>
      </article>

      <article class="card">
        <span class="step-label">PASO 9</span>
        <div class="frame-stage">
          <div class="photo-inner">
            <img src="foto-09-base-giratoria-servo.jpeg" alt="Paso 9" loading="lazy" />
          </div>
        </div>
      </article>

      <article class="card">
        <span class="step-label">PASO 10</span>
        <div class="frame-stage">
          <div class="photo-inner">
            <img src="foto-10-ensamble-hombro.jpeg" alt="Paso 10" loading="lazy" />
          </div>
        </div>
      </article>

      <article class="card">
        <span class="step-label">PASO 11</span>
        <div class="frame-stage">
          <div class="photo-inner">
            <img src="foto-11-brazo-articulado.jpeg" alt="Paso 11" loading="lazy" />
          </div>
        </div>
      </article>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
